name: Jobs Freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: jobs-freshness
  cancel-in-progress: true

jobs:
  verify-jobs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate deadline and freshness state
        run: npm run check:jobs
