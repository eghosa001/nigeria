name: Jobs Freshness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/jobs.ts"
      - "lib/job-scale-wave.ts"
      - "lib/job-runtime.ts"
      - "lib/career-guides.ts"
      - "data/home-social-trends.ts"
      - "tests/jobs-deadline-trends.test.ts"
      - "lib/job-query.ts"
      - "lib/job-topics.ts"
      - "lib/job-facets.ts"
      - "lib/job-employers.ts"
      - "lib/career-guides.ts"
      - "app/jobs/**"
      - "app/api/jobs/**"
      - "scripts/check-jobs-content.ts"
      - "scripts/check-job-links.mjs"
      - "scripts/check-job-redirects.ts"
      - "data/job-retired-redirects.json"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/jobs-freshness.yml"
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: jobs-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-jobs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect whether Jobs links changed
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "links=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$base_sha" --depth=1
          changed="$(git diff --name-only "$base_sha" HEAD)"

          # Topic-copy-only PRs need their source-backed topic check, not the
          # scheduled site-wide Job vacancy freshness queue.
          if echo "$changed" | grep -qx 'lib/job-topics.ts' && \
             ! echo "$changed" | grep -Eq '^(lib/(jobs|job-runtime|job-query|job-facets|job-employers|career-guides|job-scale-wave)[.]ts$|app/jobs/.*|app/api/jobs/.*|scripts/check-job.*|data/job-retired-redirects[.]json|next[.]config[.]ts|package[.]json)$'; then
            echo "mode=topics" >> "$GITHUB_OUTPUT"
            echo "links=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

          other_job_files="$(printf '%s\n' "$changed" | grep -E '^(lib/(jobs|job-runtime|job-query|job-topics|job-facets|job-employers|career-guides)\.ts$|app/api/jobs/|scripts/check-job-links\.mjs$|data/job-retired-redirects\.json$|next\.config\.ts$)' || true)"
          url_diff="$(git diff "$base_sha" HEAD -- lib/job-scale-wave.ts app/jobs | grep -E '^[+-].*(https?://|officialUrl|sources:|url:|href=["'\'' ]https?://)' || true)"

          if [ -n "$other_job_files" ] || [ -n "$url_diff" ]; then
            echo "links=true" >> "$GITHUB_OUTPUT"
            echo "Jobs link-bearing changes detected."
          else
            echo "links=false" >> "$GITHUB_OUTPUT"
            echo "Jobs content changed without URL changes; skipping network-wide link audit."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate Jobs content and lifecycle
        if: steps.scope.outputs.mode == 'full'
        run: npm run check:jobs && npx tsx --test tests/jobs-deadline-trends.test.ts tests/job-moniepoint-first-published-20261017.test.ts
      - name: Validate changed public-service topic against cited search intent
        if: steps.scope.outputs.mode == 'topics'
        run: node --test tests/gsc-answer-public-20261020.test.mjs
      - name: Audit Jobs official/source links
        if: steps.scope.outputs.links == 'true'
        run: npm run check:job-links
