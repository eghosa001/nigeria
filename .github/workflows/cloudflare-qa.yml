name: Cloudflare Runtime QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "data/**"
      - "tests/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "next.config.ts"
      - "playwright.cloudflare.config.ts"
      - ".github/workflows/cloudflare-qa.yml"
  pull_request:

concurrency:
  group: workers-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workers-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Cloudflare-runtime changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD^1 HEAD -- app components lib public data tests vite.config.ts wrangler.jsonc package.json next.config.ts playwright.cloudflare.config.ts; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare-runtime changes; required workflow can finish without the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - run: npm run build
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright test tests/smoke.spec.ts --config playwright.cloudflare.config.ts --workers=1
        if: steps.scope.outputs.run == 'true'
      - name: Upload Cloudflare Playwright report on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cloudflare
          path: playwright-report-cloudflare/
          retention-days: 7
