name: Cloudflare Runtime QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "data/**"
      - "tests/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "next.config.ts"
      - "playwright.cloudflare.config.ts"
      - ".github/workflows/cloudflare-qa.yml"
  pull_request:

concurrency:
  group: workers-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workers-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Cloudflare-runtime changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch origin "$base_sha" --depth=1
            changed="$(git diff --name-only "$base_sha" HEAD)"
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
          fi

          jobs_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/jobs/|app/api/jobs/|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides)\.ts$|scripts/(check-jobs-content\.ts|check-job-links\.mjs)$)' || true)"
          non_jobs="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa|jobs-freshness|indexnow)\.yml$|docs/JOBS_AND_CAREERS\.md$|package\.json$|app/jobs/|app/api/jobs/|app/search/page\.tsx$|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides|sitemap-sections|global-search)\.ts$|cloudflare/d1/jobs-scale-schema\.sql$|scripts/(check-jobs-content\.ts|check-job-links\.mjs)$)' || true)"
          tour_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/explore/|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$)' || true)"
          non_tour="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/explore/|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$)' || true)"

          if [ -n "$jobs_trigger" ] && [ -z "$non_jobs" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Jobs-only change; focused validation runs in CI, so Cloudflare browser QA is skipped."
            exit 0
          fi

          if [ -n "$tour_trigger" ] && [ -z "$non_tour" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=tour" >> "$GITHUB_OUTPUT"
            echo "Tour-only content/data change; focused validation runs in CI, so Cloudflare runtime QA is skipped."
            exit 0
          fi

          relevant="$(printf '%s\n' "$changed" | grep -E '^(app|components|lib|public|data|tests)/|^(vite\.config\.ts|wrangler\.jsonc|package\.json|next\.config\.ts|playwright\.cloudflare\.config\.ts|\.github/workflows/cloudflare-qa\.yml)$' || true)"
          if [ -z "$relevant" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare-runtime changes; required workflow can finish without the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - run: npm run build
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright test tests/smoke.spec.ts --config playwright.cloudflare.config.ts --workers=1
        if: steps.scope.outputs.run == 'true'
      - name: Upload Cloudflare Playwright report on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cloudflare
          path: playwright-report-cloudflare/
          retention-days: 7
