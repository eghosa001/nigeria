name: Cloudflare Runtime QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "data/**"
      - "tests/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "next.config.ts"
      - "playwright.cloudflare.config.ts"
      - ".github/workflows/cloudflare-qa.yml"
  pull_request:

concurrency:
  group: workers-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workers-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Cloudflare-runtime changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch origin "$base_sha" --depth=1
            changed="$(git diff --name-only "$base_sha" HEAD)"
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
          fi

          if node scripts/youtube-d1-change-scope.mjs "$changed"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=youtube-d1-integration" >> "$GITHUB_OUTPUT"
            echo "Public static adapter preserved; focused SQL and server parity run in CI."
            exit 0
          fi
          # Server-only YouTube directory filtering has exact-output unit parity
          # plus one browser route regression; avoid a duplicate Workers build.
          youtube_directory_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/entertainment/youtube/page\.tsx$|lib/youtube-directory-query\.ts$|tests/youtube-directory-query\.test\.ts$|scripts/bench-youtube-directory\.ts$)' || true)"
          non_youtube_directory="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|app/entertainment/youtube/page\.tsx$|lib/youtube-directory-query\.ts$|tests/youtube-directory-query\.test\.ts$|scripts/bench-youtube-directory\.ts$)' || true)"
          if [ -n "$youtube_directory_trigger" ] && [ -z "$non_youtube_directory" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=youtube-directory" >> "$GITHUB_OUTPUT"
            echo "Focused route checks run in Browser QA and CI; no duplicate Workers runtime job."
            exit 0
          fi

          # Full source JSON is excluded from the Worker entrypoint by this
          # change. Validate one actual Workers-rendered YouTube listing.
          # The staged D1 read adapter is not wired into a public route; CI
          # executes precise SQLite and type checks without browser packaging.
          # Staging-only D1 CLI/import configuration has no public UI or Worker
          # runtime changes. Its guard tests run in the narrow CI job.
          d1_staging_trigger="$(printf '%s\n' "$changed" | grep -E '^(wrangler\.d1-staging\.jsonc$|\.github/workflows/youtube-d1-staging\.yml$|scripts/youtube-d1-staging-runner\.mjs$|tests/youtube-d1-staging-runner\.test\.mjs$)' || true)"
          non_d1_staging="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa|youtube-d1-staging)\.yml$|wrangler\.d1-staging\.jsonc$|scripts/youtube-d1-staging-runner\.mjs$|tests/youtube-d1-staging-runner\.test\.mjs$)' || true)"
          if [ -n "$d1_staging_trigger" ] && [ -z "$non_d1_staging" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=youtube-d1-staging" >> "$GITHUB_OUTPUT"
            echo "Staging-only D1 tooling verified through focused unit checks in CI."
            exit 0
          fi

          youtube_d1_trigger="$(printf '%s\n' "$changed" | grep -E '^(lib/youtube-d1-repository\.ts$|tests/(youtube-d1-repository\.test\.ts|youtube-d1-full-parity\.test\.mjs)$|scripts/(export-youtube-d1(\.test)?\.mjs|verify-youtube-d1-sqlite\.py)$)' || true)"
          non_youtube_d1="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|lib/youtube-d1-repository\.ts$|tests/(youtube-d1-repository\.test\.ts|youtube-d1-full-parity\.test\.mjs)$|scripts/(export-youtube-d1(\.test)?\.mjs|verify-youtube-d1-sqlite\.py)$)' || true)"
          if [ -n "$youtube_d1_trigger" ] && [ -z "$non_youtube_d1" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=youtube-d1" >> "$GITHUB_OUTPUT"
            echo "Offline D1 read adapter is validated in focused CI; no runtime route changed."
            exit 0
          fi

          youtube_runtime_trigger="$(printf '%s\n' "$changed" | grep -E '^(lib/youtube-library\.ts$|data/youtube-runtime-catalog\.generated\.json$|scripts/build-youtube-runtime-catalog\.mjs$|tests/(youtube-runtime-catalog\.test\.mjs|youtube-review-lazy\.test\.ts)$)' || true)"
          non_youtube_runtime="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa|youtube-entertainment-sync)\.yml$|lib/youtube-library\.ts$|data/youtube-runtime-catalog\.generated\.json$|scripts/build-youtube-runtime-catalog\.mjs$|tests/(youtube-runtime-catalog\.test\.mjs|youtube-review-lazy\.test\.ts)$)' || true)"
          if [ -n "$youtube_runtime_trigger" ] && [ -z "$non_youtube_runtime" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=youtube-runtime" >> "$GITHUB_OUTPUT"
            echo "One Workers build and YouTube directory browser smoke directly cover the bundle-import change."
            exit 0
          fi

          # Catalog/search maintenance and proven orphan removal cannot change
          # a rendered component. CI has focused tests; skip browser install/build.
          maintenance_trigger="$(printf '%s\n' "$changed" | grep -E '^(scripts/audit-codebase\.mjs$|tests/(codebase-audit\.test\.mjs|catalog-hotpaths\.test\.ts|global-search-matching\.test\.ts)$|components/(adsense|route-wizard)\.tsx$|lib/(global-search|entertainment-query|entertainment-pagination|youtube-movie-channels)\.ts$)' || true)"
          non_maintenance="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|package\.json$|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|scripts/audit-codebase\.mjs$|tests/(codebase-audit\.test\.mjs|catalog-hotpaths\.test\.ts|global-search-matching\.test\.ts)$|components/(adsense|route-wizard)\.tsx$|lib/(global-search|entertainment-query|entertainment-pagination|youtube-movie-channels)\.ts$)' || true)"
          if [ -n "$maintenance_trigger" ] && [ -z "$non_maintenance" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=maintenance" >> "$GITHUB_OUTPUT"
            echo "Focused maintenance tests run in CI; no browser-runtime change."
            exit 0
          fi

          # Service/job catalog search internals preserve public results via
          # a focused equivalence test; avoid unrelated browser packaging.
          catalog_hotpath_trigger="$(printf '%s\n' "$changed" | grep -E '^(lib/(search|job-query|job-facets)\.ts$|tests/catalog-search-hotpaths\.test\.ts$|scripts/bench-catalog-search\.ts$)' || true)"
          non_catalog_hotpath="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|lib/(search|job-query|job-facets)\.ts$|tests/catalog-search-hotpaths\.test\.ts$|scripts/bench-catalog-search\.ts$)' || true)"
          if [ -n "$catalog_hotpath_trigger" ] && [ -z "$non_catalog_hotpath" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=catalog-hotpath" >> "$GITHUB_OUTPUT"
            echo "Search-result equivalence is covered by the catalog CI test."
            exit 0
          fi

          # Tour guide/place lookup internals have exact-output parity coverage
          # in CI; do not rebuild the site or run unrelated browser suites.
          tour_lookup_trigger="$(printf '%s\n' "$changed" | grep -E '^(tests/tour-lookup-index\.test\.ts$|scripts/bench-tour-lookup\.ts$)' || true)"
          non_tour_lookup="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|lib/(explore|explore-places)\.ts$|tests/tour-lookup-index\.test\.ts$|scripts/bench-tour-lookup\.ts$)' || true)"
          if [ -n "$tour_lookup_trigger" ] && [ -z "$non_tour_lookup" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=tour-lookup" >> "$GITHUB_OUTPUT"
            echo "Focused indexed Tour lookup regression runs in CI."
            exit 0
          fi

          jobs_trigger="$(printf '%s\n' "$changed" | grep -E '^(next\.config\.ts$|data/job-retired-redirects\.json$|app/jobs/|app/api/jobs/|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides)\.ts$|scripts/(check-jobs-content\.ts|check-job-links\.mjs|check-job-redirects\.ts)$)' || true)"
          non_jobs="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa|jobs-freshness|indexnow)\.yml$|docs/JOBS_AND_CAREERS\.md$|package\.json$|next\.config\.ts$|data/job-retired-redirects\.json$|app/jobs/|app/api/jobs/|app/search/page\.tsx$|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides|sitemap-sections|global-search)\.ts$|cloudflare/d1/jobs-scale-schema\.sql$|scripts/(check-jobs-content\.ts|check-job-links\.mjs|check-job-redirects\.ts)$)' || true)"
          tour_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/explore/|app/globals\.css$|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$|tests/explore\.spec\.ts$)' || true)"
          non_tour="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/explore/|app/globals\.css$|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$|tests/explore\.spec\.ts$)' || true)"
          entertainment_context_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/entertainment/(series/\[slug\]|youtube/\[videoId\])/page\.tsx|tests/entertainment\.spec\.ts)$' || true)"
          non_entertainment_context="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/entertainment/(series/\[slug\]|youtube/\[videoId\])/page\.tsx|tests/entertainment\.spec\.ts)$' || true)"
          quality_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/(services/|api/services/|entertainment/|api/entertainment/|explore/|jobs/|globals\.css$)|components/(site-header|service-directory|entertainment-catalog|youtube-movie-card)\.tsx$|lib/(service-query|explore|explore-places|job-scale-wave|entertainment|entertainment-query|youtube-library|sitemap-sections)\.ts$|scripts/(check-entertainment-content|check-directory-queries|check-explore-content|check-scale-contract|report-content-quality)\.ts$|tests/directory-navigation\.spec\.ts$)' || true)"
          non_quality="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|jobs-freshness)\.yml$|package\.json$|app/(services/|api/services/|entertainment/|api/entertainment/|explore/|jobs/|globals\.css$)|components/(site-header|service-directory|entertainment-catalog|youtube-movie-card)\.tsx$|lib/(service-query|explore|explore-places|job-scale-wave|entertainment|entertainment-query|youtube-library|sitemap-sections)\.ts$|scripts/(check-entertainment-content|check-directory-queries|check-explore-content|check-scale-contract|report-content-quality)\.ts$|tests/directory-navigation\.spec\.ts$)' || true)"

          analytics_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/layout\.tsx$|components/(analytics|posthog-analytics|admin-analytics-dashboard)\.tsx$|lib/(analytics-(config|safety|data)|client-analytics|posthog-(client|data))\.ts$|scripts/check-analytics-safety\.ts$)' || true)"
          non_analytics="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/layout\.tsx$|components/(analytics|posthog-analytics|admin-analytics-dashboard)\.tsx$|lib/(analytics-(config|safety|data)|client-analytics|posthog-(client|data))\.ts$|scripts/check-analytics-safety\.ts$)' || true)"
          if [ -n "$analytics_trigger" ] && [ -z "$non_analytics" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=analytics" >> "$GITHUB_OUTPUT"
            echo "Analytics tracking changes are covered by the focused CI regression."
            exit 0
          fi

          if [ -n "$jobs_trigger" ] && [ -z "$non_jobs" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Jobs-only change; focused validation runs in CI, so Cloudflare browser QA is skipped."
            exit 0
          fi

          if [ -n "$tour_trigger" ] && [ -z "$non_tour" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=tour" >> "$GITHUB_OUTPUT"
            echo "Tour-only change; running the focused Tour hub regression on the Cloudflare runtime."
            exit 0
          fi

          if [ -n "$entertainment_context_trigger" ] && [ -z "$non_entertainment_context" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=entertainment-context" >> "$GITHUB_OUTPUT"
            echo "Entertainment detail-template change; running only the focused contextual entertainment regression on Cloudflare."
            exit 0
          fi

          if [ -n "$quality_trigger" ] && [ -z "$non_quality" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=quality" >> "$GITHUB_OUTPUT"
            echo "Published-content quality change; running only the directory navigation regression on the Cloudflare runtime."
            exit 0
          fi

          relevant="$(printf '%s\n' "$changed" | grep -E '^(app|components|lib|public|data|tests)/|^(vite\.config\.ts|wrangler\.jsonc|package\.json|next\.config\.ts|playwright\.cloudflare\.config\.ts|\.github/workflows/cloudflare-qa\.yml)$' || true)"
          if [ -z "$relevant" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Cloudflare-runtime changes; required workflow can finish without the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - run: npm run build
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
      - name: Verify packed YouTube directory on Workers
        if: steps.scope.outputs.mode == 'youtube-runtime'
        run: npx playwright test tests/entertainment.spec.ts --config playwright.cloudflare.config.ts --workers=1 --grep "youtube movie directory is populated and searchable by publisher"
      - name: Run Tour hub regression
        if: steps.scope.outputs.mode == 'tour'
        run: npx playwright test tests/explore.spec.ts --config playwright.cloudflare.config.ts --workers=1 --grep "Tour hub stays compact and keeps deep navigation available"
      - name: Run contextual entertainment regression
        if: steps.scope.outputs.mode == 'entertainment-context'
        run: npx playwright test tests/entertainment.spec.ts --config playwright.cloudflare.config.ts --workers=1 --grep "contextual entertainment detail pages expose country and source dates"
      - name: Run directory navigation regression
        if: steps.scope.outputs.mode == 'quality'
        run: npx playwright test tests/directory-navigation.spec.ts --config playwright.cloudflare.config.ts --workers=1
      - run: npx playwright test tests/smoke.spec.ts --config playwright.cloudflare.config.ts --workers=1
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.mode != 'quality' && steps.scope.outputs.mode != 'tour' && steps.scope.outputs.mode != 'entertainment-context' && steps.scope.outputs.mode != 'youtube-runtime'
      - name: Upload Cloudflare Playwright report on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cloudflare
          path: playwright-report-cloudflare/
          retention-days: 7
