name: Source integrity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sources.mjs
