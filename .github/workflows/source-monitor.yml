name: Source integrity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
  push:
    branches: [main]
    paths:
      - "lib/data.ts"
      - "data/services.json"
      - "lib/offices.ts"
      - "lib/official-links.ts"
      - "data/source-monitors.json"
      - "scripts/check-sources.mjs"
      - "scripts/check-links.mjs"
      - ".github/workflows/source-monitor.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sources.mjs
      - run: node scripts/check-links.mjs
