name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:cloudflare
      - run: npm run build:vinext
      - name: Prevent accidental KV dependency
        run: |
          if grep -R '"kv_namespaces"' wrangler.jsonc dist/server/wrangler.json 2>/dev/null; then
            echo "Unexpected KV namespace detected. GovGuide launch must stay KV-free."
            exit 1
          fi
      - name: Package Cloudflare Worker without deploying
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
