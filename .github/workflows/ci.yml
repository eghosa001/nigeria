name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect product-CI-relevant changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch origin "$base_sha" --depth=1
            changed="$(git diff --name-only "$base_sha" HEAD)"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$before" --depth=1 || true
              changed="$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD^1 HEAD)"
            else
              changed="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
            fi
          fi

          if node scripts/youtube-d1-production-scope.mjs "$changed"; then
            echo "mode=youtube-d1-production" >> "$GITHUB_OUTPUT"
            echo "Production binding only; focused guard/config checks run in CI, artifact validation runs in postbuild."
            exit 0
          fi

          if node scripts/youtube-d1-change-scope.mjs "$changed"; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "mode=youtube-d1-integration" >> "$GITHUB_OUTPUT"
            else
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "Integration candidate verified in PR; do not duplicate its staging probe on merge."
            fi
            exit 0
          fi

          # Snapshot-only Tour continuity analysis and existing NIN guide copy.
          # Keep it isolated from expensive product builds and unrelated audits.
          tour_audit_changed="$(printf '%s\n' "$changed" | grep -E '^(scripts/(tour-migration-audit|check-tour-migration-readiness)\.ts$|tests/tour-migration-audit\.test\.ts$)' || true)"
          tour_audit_other="$(printf '%s\n' "$changed" | grep -Ev '^((scripts/(tour-migration-audit|check-tour-migration-readiness)\.ts$)|(tests/tour-migration-audit\.test\.ts$)|(cloudflare/d1/tour-place-continuity-schema\.sql$)|(docs/research/tour-migration-readiness-2026-10-12\.md$)|(data/(services\.json|service-seo-overrides\.ts)$)|(lib/search-answers\.ts$)|(\.github/workflows/ci\.yml$))' || true)"
          if [ -n "$tour_audit_changed" ] && [ -z "$tour_audit_other" ]; then
            echo "mode=tour-migration-audit" >> "$GITHUB_OUTPUT"
            echo "Read-only Tour continuity audit and one existing NIN guide."
            exit 0
          fi

          # Tour D1 adapter and its unchanged existing travel canonicals use a
          # focused FTS/publication regression; browser/runtime checks run separately.
          tour_d1_changed="$(printf '%s\n' "$changed" | grep -E '^(lib/tour-place-(d1-repository|search-store)\.ts$|tests/tour-place-d1-repository\.test\.ts$)' || true)"
          tour_d1_other="$(printf '%s\n' "$changed" | grep -Ev '^(lib/(tour-place-(d1-repository|search-store)|global-search)\.ts$|app/explore/\[slug\]/page\.tsx$|tests/tour-place-d1-repository\.test\.ts$|docs/research/tour-d1-indexed-search-2026-10-11\.md$|\.github/workflows/ci\.yml$)' || true)"
          if [ -n "$tour_d1_changed" ] && [ -z "$tour_d1_other" ]; then
            echo "mode=tour-indexed" >> "$GITHUB_OUTPUT"
            echo "Tour D1 FTS and published-only adapter: focused check."
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(lib/(search-console-hourly|analytics-data)\.ts|components/admin-analytics-dashboard\.tsx|tests/search-console-hourly\.test\.ts)$'; then
            echo "gsc_hourly_changed=true" >> "$GITHUB_OUTPUT"
          fi

          relevant="$(
            printf '%s\n' "$changed" |
              grep -E '^(app|components|lib|data|tests)/|^cloudflare/d1/jobs-scale-schema\.sql$|^scripts/|^(package(-lock)?\.json|tsconfig\.json|next\.config\.(js|mjs|ts)|vite\.config\.ts|wrangler\.jsonc|playwright.*\.config\.ts)$' |
              grep -v '^scripts/fast_path_guard\.py$' || true
          )"

          if [ -z "$relevant" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No product-CI-relevant changes; required CI check can finish immediately."
          else
            jobs_trigger="$(printf '%s\n' "$changed" | grep -E '^(next\.config\.ts$|data/job-retired-redirects\.json$|app/jobs/|app/api/jobs/|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides)\.ts$|scripts/(check-jobs-content\.ts|check-job-links\.mjs|check-job-redirects\.ts)$)' || true)"
            non_jobs="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa|jobs-freshness|indexnow)\.yml$|docs/JOBS_AND_CAREERS\.md$|package\.json$|next\.config\.ts$|data/job-retired-redirects\.json$|app/jobs/|app/api/jobs/|app/search/page\.tsx$|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides|sitemap-sections|global-search)\.ts$|cloudflare/d1/jobs-scale-schema\.sql$|scripts/(check-jobs-content\.ts|check-job-links\.mjs|check-job-redirects\.ts)$)' || true)"
            tour_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/explore/|app/globals\.css$|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$|tests/explore\.spec\.ts$)' || true)"
            non_tour="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/explore/|app/globals\.css$|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$|tests/explore\.spec\.ts$)' || true)"
            quality_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/(services/|api/services/|entertainment/|api/entertainment/|explore/|jobs/|globals\.css$)|components/(site-header|service-directory|entertainment-catalog|youtube-movie-card)\.tsx$|lib/(service-query|explore|explore-places|job-scale-wave|entertainment|entertainment-query|youtube-library|sitemap-sections)\.ts$|scripts/(check-entertainment-content|check-directory-queries|check-explore-content|check-scale-contract|report-content-quality)\.ts$|tests/directory-navigation\.spec\.ts$)' || true)"
            non_quality="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|jobs-freshness)\.yml$|package\.json$|app/(services/|api/services/|entertainment/|api/entertainment/|explore/|jobs/|globals\.css$)|components/(site-header|service-directory|entertainment-catalog|youtube-movie-card)\.tsx$|lib/(service-query|explore|explore-places|job-scale-wave|entertainment|entertainment-query|youtube-library|sitemap-sections)\.ts$|scripts/(check-entertainment-content|check-directory-queries|check-explore-content|check-scale-contract|report-content-quality)\.ts$|tests/directory-navigation\.spec\.ts$)' || true)"

            analytics_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/layout\.tsx$|components/(analytics|posthog-analytics|admin-analytics-dashboard)\.tsx$|lib/(analytics-(config|safety|data)|client-analytics|posthog-(client|data))\.ts$|scripts/check-analytics-safety\.ts$)' || true)"
            non_analytics="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/layout\.tsx$|components/(analytics|posthog-analytics|admin-analytics-dashboard)\.tsx$|lib/(analytics-(config|safety|data)|client-analytics|posthog-(client|data))\.ts$|scripts/check-analytics-safety\.ts$)' || true)"
            # For this self-contained visual fix, Browser QA runs the focused
            # contrast/layout regression; avoid broad unrelated CI work.
            movie_discovery_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/entertainment/(movies/page\.tsx|entertainment\.css)|tests/movie-discovery-contrast\.spec\.ts)$' || true)"
            non_movie_discovery="$(printf '%s\n' "$changed" | grep -Ev '^(app/entertainment/(movies/page\.tsx|entertainment\.css)|tests/movie-discovery-contrast\.spec\.ts|\.github/workflows/(ui-qa|ci)\.yml)$' || true)"
            # Index/cache-only catalog changes have a dedicated focused test.
            catalog_hotpath_trigger="$(printf '%s\n' "$changed" | grep -E '^(lib/(search|job-query|job-facets)\.ts$|tests/catalog-search-hotpaths\.test\.ts$|scripts/bench-catalog-search\.ts$)' || true)"
            non_catalog_hotpath="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|lib/(search|job-query|job-facets)\.ts$|tests/catalog-search-hotpaths\.test\.ts$|scripts/bench-catalog-search\.ts$)' || true)"
            # Maintenance-only edits need narrow regression checks, not the full
            # site build/QA pipeline. Match a fixed, reviewed file allowlist.
            maintenance_trigger="$(printf '%s\n' "$changed" | grep -E '^(scripts/audit-codebase\.mjs$|tests/(codebase-audit\.test\.mjs|catalog-hotpaths\.test\.ts|global-search-matching\.test\.ts)$|components/(adsense|route-wizard)\.tsx$|lib/(global-search|entertainment-query|entertainment-pagination|youtube-movie-channels)\.ts$)' || true)"
            non_maintenance="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|package\.json$|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|scripts/audit-codebase\.mjs$|tests/(codebase-audit\.test\.mjs|catalog-hotpaths\.test\.ts|global-search-matching\.test\.ts)$|components/(adsense|route-wizard)\.tsx$|lib/(global-search|entertainment-query|entertainment-pagination|youtube-movie-channels)\.ts$)' || true)"
            tour_lookup_trigger="$(printf '%s\n' "$changed" | grep -E '^(tests/tour-lookup-index\.test\.ts$|scripts/bench-tour-lookup\.ts$)' || true)"
            non_tour_lookup="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|lib/(explore|explore-places)\.ts$|tests/tour-lookup-index\.test\.ts$|scripts/bench-tour-lookup\.ts$)' || true)"
            youtube_directory_trigger="$(printf '%s\n' "$changed" | grep -E '^(tests/youtube-directory-query\.test\.ts$|scripts/bench-youtube-directory\.ts$)' || true)"
            non_youtube_directory="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|app/entertainment/youtube/page\.tsx$|lib/youtube-directory-query\.ts$|tests/youtube-directory-query\.test\.ts$|scripts/bench-youtube-directory\.ts$)' || true)"
            youtube_runtime_trigger="$(printf '%s\n' "$changed" | grep -E '^(lib/youtube-library\.ts$|data/youtube-runtime-catalog\.generated\.json$|scripts/build-youtube-runtime-catalog\.mjs$|tests/(youtube-runtime-catalog\.test\.mjs|youtube-review-lazy\.test\.ts)$)' || true)"
            non_youtube_runtime="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa|youtube-entertainment-sync)\.yml$|lib/youtube-library\.ts$|data/youtube-runtime-catalog\.generated\.json$|scripts/build-youtube-runtime-catalog\.mjs$|tests/(youtube-runtime-catalog\.test\.mjs|youtube-review-lazy\.test\.ts)$)' || true)"
            youtube_d1_trigger="$(printf '%s\n' "$changed" | grep -E '^(lib/youtube-d1-repository\.ts$|tests/(youtube-d1-repository\.test\.ts|youtube-d1-full-parity\.test\.mjs)$|scripts/(export-youtube-d1(\.test)?\.mjs|verify-youtube-d1-sqlite\.py)$)' || true)"
            non_youtube_d1="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa)\.yml$|lib/youtube-d1-repository\.ts$|tests/(youtube-d1-repository\.test\.ts|youtube-d1-full-parity\.test\.mjs)$|scripts/(export-youtube-d1(\.test)?\.mjs|verify-youtube-d1-sqlite\.py)$)' || true)"
            youtube_d1_staging_trigger="$(printf '%s\n' "$changed" | grep -E '^(wrangler\.d1-staging\.jsonc$|\.github/workflows/youtube-d1-staging\.yml$|scripts/youtube-d1-staging-runner\.mjs$|tests/youtube-d1-staging-runner\.test\.mjs$)' || true)"
            non_youtube_d1_staging="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/(ci|ui-qa|cloudflare-qa|youtube-d1-staging)\.yml$|wrangler\.d1-staging\.jsonc$|scripts/youtube-d1-staging-runner\.mjs$|tests/youtube-d1-staging-runner\.test\.mjs$)' || true)"
            if [ -n "$youtube_d1_staging_trigger" ] && [ -z "$non_youtube_d1_staging" ]; then
              echo "mode=youtube-d1-staging" >> "$GITHUB_OUTPUT"
              echo "Isolated D1 staging setup: test only config and non-destructive import formatting."
            elif [ -n "$youtube_d1_trigger" ] && [ -z "$non_youtube_d1" ]; then
              echo "mode=youtube-d1" >> "$GITHUB_OUTPUT"
              echo "Offline YouTube D1 export tooling: schema compatibility and dry-run only."
            elif [ -n "$youtube_runtime_trigger" ] && [ -z "$non_youtube_runtime" ]; then
              echo "mode=youtube-runtime" >> "$GITHUB_OUTPUT"
              echo "Packed YouTube source-only change: verify lossless round trips and existing listing behavior."
            elif [ -n "$youtube_directory_trigger" ] && [ -z "$non_youtube_directory" ]; then
              echo "mode=youtube-directory" >> "$GITHUB_OUTPUT"
              echo "YouTube directory-only change: exact result parity and bounded lookup CPU checks."
            elif [ -n "$tour_lookup_trigger" ] && [ -z "$non_tour_lookup" ]; then
              echo "mode=tour-lookup" >> "$GITHUB_OUTPUT"
              echo "Tour lookup-only edit: check exact result parity and bounded CPU comparison."
            elif [ -n "$catalog_hotpath_trigger" ] && [ -z "$non_catalog_hotpath" ]; then
              echo "mode=catalog-hotpath" >> "$GITHUB_OUTPUT"
              echo "Catalog hot-path change: run only parity regression and bounded CPU measurement."
            elif [ -n "$maintenance_trigger" ] && [ -z "$non_maintenance" ]; then
              echo "mode=maintenance" >> "$GITHUB_OUTPUT"
              echo "Run changed-surface catalog/search and audit tests only."
            elif [ -n "$movie_discovery_trigger" ] && [ -z "$non_movie_discovery" ]; then
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              echo "Focused Browser QA covers this movie discovery-only design change."
            elif [ -n "$analytics_trigger" ] && [ -z "$non_analytics" ]; then
              echo "mode=analytics" >> "$GITHUB_OUTPUT"
              echo "Analytics-only change: run focused tracking safety regression."
            elif [ -n "$jobs_trigger" ] && [ -z "$non_jobs" ]; then
              echo "mode=jobs" >> "$GITHUB_OUTPUT"
              printf 'Jobs-only product files:\n%s\n' "$changed"
            elif [ -n "$tour_trigger" ] && [ -z "$non_tour" ]; then
              echo "mode=tour" >> "$GITHUB_OUTPUT"
              printf 'Tour-only product files:\n%s\n' "$changed"
            elif [ -n "$quality_trigger" ] && [ -z "$non_quality" ]; then
              echo "mode=quality" >> "$GITHUB_OUTPUT"
              printf 'Published-content quality files:\n%s\n' "$changed"
            else
              echo "mode=full" >> "$GITHUB_OUTPUT"
              printf 'Product-CI-relevant files:\n%s\n' "$relevant"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'skip'
        with:
          node-version: ${{ steps.scope.outputs.mode == 'youtube-d1-integration' && '24' || '22' }}
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.mode != 'skip' && steps.scope.outputs.mode != 'youtube-d1-integration' && steps.scope.outputs.mode != 'youtube-d1-production'
      - name: Validate production D1 registration and deploy artifact guard
        if: steps.scope.outputs.mode == 'youtube-d1-production'
        run: |
          python3 scripts/fast_path_guard.py
          node --test tests/youtube-d1-staging-runner.test.mjs tests/wrangler-deploy-config.test.mjs
      - name: Validate YouTube server boundary and indexed D1 queries
        if: steps.scope.outputs.mode == 'youtube-d1-integration'
        run: |
          npm install --prefix "$RUNNER_TEMP/youtube-d1-tools" --ignore-scripts --no-audit --no-fund tsx@4.20.6 typescript@5.9.3 @types/node@24.0.0
          ln -s "$RUNNER_TEMP/youtube-d1-tools/node_modules" node_modules
          node node_modules/tsx/dist/cli.mjs --test tests/youtube-d1-repository.test.ts tests/youtube-d1-query.test.ts tests/youtube-server-store.test.ts
          node scripts/check-youtube-d1-types.mjs
      - name: Verify authorized staging queries and source parity (read-only)
        if: steps.scope.outputs.mode == 'youtube-d1-integration' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '19a03bec57c0277e01e1e70e241576af' }}
        run: node node_modules/tsx/dist/cli.mjs scripts/verify-youtube-d1-queries.ts
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.mode == 'youtube-d1-integration'
        with:
          name: youtube-d1-query-evidence
          path: work/youtube-d1-query-report.json
          if-no-files-found: ignore
      - name: Validate isolated YouTube D1 staging import
        if: steps.scope.outputs.mode == 'youtube-d1-staging'
        run: |
          python3 scripts/fast_path_guard.py
          node --test tests/youtube-d1-staging-runner.test.mjs
      - name: Validate offline YouTube D1 read and complete catalog migration
        if: steps.scope.outputs.mode == 'youtube-d1'
        run: |
          python3 scripts/fast_path_guard.py
          node --test scripts/export-youtube-d1.test.mjs tests/youtube-d1-full-parity.test.mjs
          npx tsx --test tests/youtube-d1-repository.test.ts
          npx tsc --noEmit --strict --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --types node lib/youtube-d1-repository.ts tests/youtube-d1-repository.test.ts
          node scripts/export-youtube-d1.mjs --dry-run
      - name: Verify packed YouTube runtime data
        if: steps.scope.outputs.mode == 'youtube-runtime'
        run: |
          python3 scripts/fast_path_guard.py
          node --test tests/youtube-runtime-catalog.test.mjs
          npx tsx --test tests/youtube-directory-query.test.ts
          npx tsx --test tests/youtube-review-lazy.test.ts
      - name: Verify YouTube directory query compatibility
        if: steps.scope.outputs.mode == 'youtube-directory'
        run: |
          python3 scripts/fast_path_guard.py
          npx tsx --test tests/youtube-directory-query.test.ts
          npx tsx scripts/bench-youtube-directory.ts
      - name: Verify read-only Tour continuity and NIN service change
        if: steps.scope.outputs.mode == 'tour-migration-audit'
        run: |
          python3 scripts/fast_path_guard.py
          npx tsx --test tests/tour-migration-audit.test.ts
          npx tsx scripts/check-tour-migration-readiness.ts
          npm run check:service-catalog
      - name: Verify Tour D1 indexed publication boundary
        if: steps.scope.outputs.mode == 'tour-indexed'
        run: |
          python3 scripts/fast_path_guard.py
          npx tsx --test tests/tour-place-d1-repository.test.ts
      - name: Validate Tour lookup index
        if: steps.scope.outputs.mode == 'tour-lookup'
        run: |
          python3 scripts/fast_path_guard.py
          npx tsx --test tests/tour-lookup-index.test.ts
          npx tsx scripts/bench-tour-lookup.ts
      - name: Validate catalog hot-path work
        if: steps.scope.outputs.mode == 'catalog-hotpath'
        run: |
          python3 scripts/fast_path_guard.py
          npx tsx --test tests/catalog-search-hotpaths.test.ts
          npx tsx scripts/bench-catalog-search.ts
      - name: Validate codebase-maintenance changes
        if: steps.scope.outputs.mode == 'maintenance'
        run: |
          python3 scripts/fast_path_guard.py
          node --test tests/codebase-audit.test.mjs
          npx tsx --test tests/catalog-hotpaths.test.ts tests/global-search-matching.test.ts
          node scripts/audit-codebase.mjs --json > /tmp/codebase-audit.json
          node -e 'const r=require("/tmp/codebase-audit.json"); console.log(JSON.stringify({inventory:r.inventory, reviewCandidates:r.reviewCandidates, unresolvedImports:r.unresolvedLocalImports.length, computedImports:r.unknownDynamicImports.length},null,2))'
      - name: Test Google Search Console hourly reporting
        if: steps.scope.outputs.gsc_hourly_changed == 'true'
        run: npx tsx --test tests/search-console-hourly.test.ts
      - name: Validate Jobs & Careers changes
        if: steps.scope.outputs.mode == 'jobs'
        run: |
          python3 scripts/fast_path_guard.py
          npm run check:jobs
      - name: Validate Tour Nigeria changes
        if: steps.scope.outputs.mode == 'tour'
        run: |
          python3 scripts/fast_path_guard.py
          npm run check:explore
      - name: Validate published-content quality changes
        if: steps.scope.outputs.mode == 'quality'
        run: |
          python3 scripts/fast_path_guard.py
          npm run check:service-catalog
          npm run check:content
          npm run check:explore
          npm run check:entertainment-scale
          npm run check:jobs
          npm run check:scale
          npm run check:directory-queries
          npm run quality:status
      - run: npm run check:analytics-safety
        if: steps.scope.outputs.mode == 'analytics'
      - run: node scripts/check-production-audit.mjs
        if: steps.scope.outputs.mode == 'full'
      - name: Verify recent movie selection and release gating
        if: steps.scope.outputs.mode == 'full'
        run: npx tsx --test tests/home-movie-highlights.test.ts
      - run: npm run typecheck
        if: steps.scope.outputs.mode == 'full'
      - run: npm run check:service-catalog
        if: steps.scope.outputs.mode == 'full'
      - run: npm run check:content
        if: steps.scope.outputs.mode == 'full'
      - run: npm run check:explore
        if: steps.scope.outputs.mode == 'full'
      - name: Verify source-backed release and YouTube scan regressions
        if: steps.scope.outputs.mode == 'full'
        run: node --test tests/source-freshness-2026-10-10.test.mjs
      - run: npm run check:entertainment-scale
        if: steps.scope.outputs.mode == 'full'
      - run: npm run check:analytics-safety
        if: steps.scope.outputs.mode == 'full'
      - run: npm run build:next
        if: steps.scope.outputs.mode == 'full'
      - run: npm run check:cloudflare
        if: steps.scope.outputs.mode == 'full'
      - run: npm run build
        if: steps.scope.outputs.mode == 'full'
      - name: Prevent accidental KV dependency
        if: steps.scope.outputs.mode == 'full'
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const files = ["wrangler.jsonc", "dist/server/wrangler.json"];
          for (const file of files) {
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            if (Array.isArray(config.kv_namespaces) && config.kv_namespaces.length > 0) {
              console.error("Unexpected KV namespace detected in " + file);
              process.exit(1);
            }
          }
          console.log("KV-free deployment confirmed.");
          NODE
      - name: Package Cloudflare Worker without deploying
        if: steps.scope.outputs.mode == 'full'
        run: npx wrangler deploy --dry-run
