name: YouTube Entertainment Sync

# Production refresh runs manually or on schedule; catalog updates land through a PR.
on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: Re-scan the complete approved-channel back catalog
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 4 * * 1-6"
    - cron: "17 5 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: youtube-entertainment-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: api-key
        name: Check YouTube API credential
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_DATA_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::YOUTUBE_DATA_API_KEY is not configured; sync skipped."
          fi

      - name: Require YouTube API credential for requested population
        if: steps.api-key.outputs.present != 'true' && github.event_name != 'schedule'
        run: |
          echo "::error::YOUTUBE_DATA_API_KEY is missing. Enable YouTube Data API v3, create an API key, and save it as a repository Actions secret named YOUTUBE_DATA_API_KEY."
          exit 1

      - id: sync-mode
        if: steps.api-key.outputs.present == 'true'
        name: Choose incremental or full scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_FULL_SYNC: ${{ inputs.full_sync }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FULL_SYNC" = "true" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "17 5 * * 0" ]; then
            echo "full=1" >> "$GITHUB_OUTPUT"
          else
            echo "full=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync approved YouTube movie channels
        if: steps.api-key.outputs.present == 'true'
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          YOUTUBE_FULL_SYNC: ${{ steps.sync-mode.outputs.full }}
        run: node scripts/sync-youtube-entertainment.mjs

      - name: Validate generated entertainment catalog
        if: steps.api-key.outputs.present == 'true'
        run: node scripts/check-entertainment-scale.mjs

      - id: changes
        if: steps.api-key.outputs.present == 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/youtube-channel-cache.json data/youtube-movies.generated.json data/youtube-movies-review.generated.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/youtube-entertainment-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/youtube-channel-cache.json data/youtube-movies.generated.json data/youtube-movies-review.generated.json
          git commit -m "Refresh approved YouTube movie catalog"
          git push --force origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh approved YouTube movie catalog" \
            --body "Automated metadata refresh from the official YouTube Data API. Daily runs ingest only uploads newer than each channel's saved frontier; the Sunday run performs a complete revalidation. Only approved channels and full-length movies that pass quality filters are included." \
            || gh pr edit "$BRANCH" \
              --title "Refresh approved YouTube movie catalog" \
              --body "Automated metadata refresh from the official YouTube Data API. Daily runs ingest only uploads newer than each channel's saved frontier; the Sunday run performs a complete revalidation. Only approved channels and full-length movies that pass quality filters are included."
