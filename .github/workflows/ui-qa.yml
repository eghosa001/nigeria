            exit 0
          fi

          premium_trigger="$(printf '%s\n' "$changed" | grep -E '^(components/(personal-library|on-demand-live-jobs)\.tsx|app/(saved/page\.tsx|ux-polish\.css)|tests/premium-ux-retention\.spec\.ts)
          if [ -n "$premium_trigger" ]; then
