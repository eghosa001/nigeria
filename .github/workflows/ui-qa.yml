      - name: Run homepage regression
        if: steps.scope.outputs.mode == 'homepage'
        run: npx playwright test tests/explore.spec.ts --project=desktop --project=mobile --workers=1 --grep "homepage exposes movies, services, tour and jobs as primary paths"
      - name: Run search-demand growth regression
        if: steps.scope.outputs.mode == 'growth'
        run: npx playwright test tests/search-demand-growth.spec.ts --project=desktop --workers=1
      - name: Run Tour hub regression
        if: steps.scope.outputs.mode == 'tour'
        run: npx playwright test tests/explore.spec.ts --project=mobile --workers=1 --grep "Tour hub stays compact and keeps deep navigation available"
      - name: Run contextual entertainment regression
        if: steps.scope.outputs.mode == 'entertainment-context'
        run: npx playwright test tests/entertainment.spec.ts --project=desktop --workers=1 --grep "contextual entertainment detail pages expose country and source dates"
      - name: Run directory navigation regression
        if: steps.scope.outputs.mode == 'quality'
        run: npx playwright test tests/directory-navigation.spec.ts --project=desktop --workers=1
      - name: Run browser smoke regression
        if: steps.scope.outputs.mode == 'smoke'
        run: npx playwright test tests/smoke.spec.ts --project=desktop --workers=1
      - name: Run admin editing regression first
        if: steps.scope.outputs.mode == 'full'
        run: npx playwright test tests/admin-editing.spec.ts tests/admin-github.spec.ts --project=desktop --workers=1
      - name: Run full browser suite
        if: steps.scope.outputs.mode == 'full'
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
