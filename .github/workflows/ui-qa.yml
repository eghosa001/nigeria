name: Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/ui-qa.yml"
  pull_request:

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect browser-relevant changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: full browser suite explicitly requested."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git fetch origin "$base_sha" --depth=1
            changed="$(git diff --name-only "$base_sha" HEAD)"
          else
            changed="$(git diff --name-only HEAD^1 HEAD)"
          fi

          relevant="$(printf '%s\n' "$changed" | grep -E '^(app|components|data|lib|public|tests)/|^(playwright\.config\.ts|package\.json|next\.config\.ts|\.github/workflows/ui-qa\.yml)$' || true)"
          if [ -z "$relevant" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No browser-relevant changes; required smoke check can finish immediately."
            exit 0
          fi

          jobs_trigger="$(printf '%s\n' "$changed" | grep -E '^(next\.config\.ts$|data/job-retired-redirects\.json$|app/jobs/|app/api/jobs/|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides)\.ts$|scripts/(check-jobs-content\.ts|check-job-links\.mjs|check-job-redirects\.ts)$)' || true)"
          non_jobs="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa|jobs-freshness|indexnow)\.yml$|docs/JOBS_AND_CAREERS\.md$|package\.json$|next\.config\.ts$|data/job-retired-redirects\.json$|app/jobs/|app/api/jobs/|app/search/page\.tsx$|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides|sitemap-sections|global-search)\.ts$|cloudflare/d1/jobs-scale-schema\.sql$|scripts/(check-jobs-content\.ts|check-job-links\.mjs|check-job-redirects\.ts)$)' || true)"
          tour_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/explore/|app/globals\.css$|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$|tests/explore\.spec\.ts$)' || true)"
          non_tour="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/explore/|app/globals\.css$|components/explore-place-directory\.tsx$|lib/explore(-places)?\.ts$|scripts/check-explore-content\.ts$|tests/explore\.spec\.ts$)' || true)"
          entertainment_context_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/entertainment/(series/\[slug\]|youtube/\[videoId\])/page\.tsx|tests/entertainment\.spec\.ts)$' || true)"
          non_entertainment_context="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|app/entertainment/(series/\[slug\]|youtube/\[videoId\])/page\.tsx|tests/entertainment\.spec\.ts)$' || true)"
          quality_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/(services/|api/services/|entertainment/|api/entertainment/|explore/|jobs/|globals\.css$)|components/(site-header|service-directory|entertainment-catalog|youtube-movie-card)\.tsx$|lib/(service-query|explore|explore-places|job-scale-wave|entertainment|entertainment-query|youtube-library|sitemap-sections)\.ts$|scripts/(check-entertainment-content|check-directory-queries|check-explore-content|check-scale-contract|report-content-quality)\.ts$|tests/directory-navigation\.spec\.ts$)' || true)"
          non_quality="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|jobs-freshness)\.yml$|package\.json$|app/(services/|api/services/|entertainment/|api/entertainment/|explore/|jobs/|globals\.css$)|components/(site-header|service-directory|entertainment-catalog|youtube-movie-card)\.tsx$|lib/(service-query|explore|explore-places|job-scale-wave|entertainment|entertainment-query|youtube-library|sitemap-sections)\.ts$|scripts/(check-entertainment-content|check-directory-queries|check-explore-content|check-scale-contract|report-content-quality)\.ts$|tests/directory-navigation\.spec\.ts$)' || true)"

          editorial_home_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/page\.tsx|app/entertainment/movies/page\.tsx|tests/home-editorial-curation\.spec\.ts)$' || true)"
          unrelated_editorial_home="$(printf '%s\n' "$changed" | grep -Ev '^(app/page\.tsx|app/entertainment/movies/page\.tsx|tests/home-editorial-curation\.spec\.ts|docs/PREMIUM_UX_STANDARD\.md|\.github/workflows/ui-qa\.yml)$' || true)"
          if [ -n "$editorial_home_trigger" ] && [ -z "$unrelated_editorial_home" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=editorial-home" >> "$GITHUB_OUTPUT"
            echo "Homepage and featured-film changes; running compact curation check."
            exit 0
          fi

          premium_quality_trigger="$(printf '%s\n' "$changed" | grep -E '^(tests/premium-quality-gate\.spec\.ts|components/site-header\.tsx|app/(mobile|ux-polish|theme)\.css)$' || true)"
          if [ -n "$premium_quality_trigger" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=premium-quality" >> "$GITHUB_OUTPUT"
            echo "Changed shared premium UX guard; running focused four-pillar entry-point contract."
            exit 0
          fi

          adsense_trigger="$(printf '%s\n' "$changed" | grep -E '^(components/(adsense|ad-slot)\.tsx|lib/adsense-config\.ts|tests/adsense-build-parity\.spec\.ts)$' || true)"
          if [ -n "$adsense_trigger" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=adsense" >> "$GITHUB_OUTPUT"
            echo "Changed AdSense integration; running focused environment-parity regression."
            exit 0
          fi

          if printf '%s\n' "$changed" | grep -q '^tests/seo-audit-regression\.spec\.ts
          if [ -n "$premium_trigger" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=premium" >> "$GITHUB_OUTPUT"
            echo "Personal library and UX changes; running focused retention checks."
            exit 0
          fi

          if [ -n "$jobs_trigger" ] && [ -z "$non_jobs" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=jobs" >> "$GITHUB_OUTPUT"
            echo "Jobs-only change; focused validation runs in CI, so browser QA is skipped."
            exit 0
          fi

          if [ -n "$tour_trigger" ] && [ -z "$non_tour" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=tour" >> "$GITHUB_OUTPUT"
            echo "Tour-only change; running the focused Tour hub regression."
            exit 0
          fi

          if [ -n "$entertainment_context_trigger" ] && [ -z "$non_entertainment_context" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=entertainment-context" >> "$GITHUB_OUTPUT"
            echo "Entertainment detail-template change; running only the focused contextual entertainment regression."
            exit 0
          fi

          if [ -n "$quality_trigger" ] && [ -z "$non_quality" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mode=quality" >> "$GITHUB_OUTPUT"
            echo "Published-content quality change; running only the directory navigation regression."
            exit 0
          fi

          non_navigation="$(printf '%s\n' "$changed" | grep -Ev '^(components/site-header\.tsx|components/site-footer\.tsx|tests/smoke\.spec\.ts|tests/live-deployment\.spec\.ts|\.github/workflows/cloudflare-direct-deploy\.yml|\.github/workflows/ui-qa\.yml)$' || true)"
          non_homepage="$(printf '%s\n' "$changed" | grep -Ev '^(app/page\.tsx|app/globals\.css|tests/explore\.spec\.ts|\.github/workflows/ui-qa\.yml)$' || true)"
          non_growth="$(printf '%s\n' "$changed" | grep -Ev '^(app/page\.tsx|app/jobs/(page\.tsx|graduate/page\.tsx|remote/page\.tsx)|app/entertainment/(page\.tsx|series/(page\.tsx|\[slug\]/page\.tsx)|movies/(\[slug\]/page\.tsx|october-2026/page\.tsx))|app/explore/(page\.tsx|\[slug\]/page\.tsx|things-to-do-(lagos|abuja)/page\.tsx)|data/(category-faqs|service-seo-overrides)\.ts|data/services\.json|lib/(data|growth-hubs|series|entertainment|entertainment-extras|sitemap-sections)\.ts|docs/SEARCH_DEMAND_GROWTH_PLAN\.md|scripts/verify-service-migration\.ts|tests/(explore|service-records|search-demand-growth)\.spec\.ts|\.github/workflows/ui-qa\.yml)$' || true)"

          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ -z "$non_navigation" ]; then
            echo "mode=navigation" >> "$GITHUB_OUTPUT"
            echo "Navigation-only change; running focused navigation regression."
          elif [ -z "$non_homepage" ]; then
            echo "mode=homepage" >> "$GITHUB_OUTPUT"
            echo "Homepage-only change; running focused homepage regression."
          elif [ -z "$non_growth" ]; then
            echo "mode=growth" >> "$GITHUB_OUTPUT"
            echo "Search-demand growth change; running focused growth regression."
          else
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
            echo "Browser-relevant change; running focused smoke regression only."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - run: npm run build:next
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
      - name: Run homepage and featured-film editorial curation
        if: steps.scope.outputs.mode == 'editorial-home'
        run: npx playwright test tests/home-editorial-curation.spec.ts --project=desktop --workers=1
      - name: Run premium four-pillar quality contract
        if: steps.scope.outputs.mode == 'premium-quality'
        run: npx playwright test tests/premium-quality-gate.spec.ts --project=desktop --workers=1
      - name: Run AdSense deployment-parity regression
        if: steps.scope.outputs.mode == 'adsense'
        run: npx playwright test tests/adsense-build-parity.spec.ts --project=desktop --workers=1
      - name: Run focused SEO audit regressions
        if: steps.scope.outputs.mode == 'seo-audit'
        run: npx playwright test tests/seo-audit-regression.spec.ts --project=desktop --workers=1
      - name: Run premium UX and retention regression
        if: steps.scope.outputs.mode == 'premium'
        run: npx playwright test tests/premium-ux-retention.spec.ts --project=desktop --project=mobile --workers=1
      - name: Run navigation regression
        if: steps.scope.outputs.mode == 'navigation'
        run: npx playwright test tests/smoke.spec.ts --project=desktop --workers=1 --grep "phone shell fits and keeps admin out of public navigation without hydration errors|mobile public layout uses a single-column hierarchy and usable navigation"
      - name: Run homepage regression
        if: steps.scope.outputs.mode == 'homepage'
        run: npx playwright test tests/explore.spec.ts --project=desktop --project=mobile --workers=1 --grep "homepage exposes movies, services, tour and jobs as primary paths"
      - name: Run search-demand growth regression
        if: steps.scope.outputs.mode == 'growth'
        run: npx playwright test tests/search-demand-growth.spec.ts --project=desktop --workers=1
      - name: Run Tour hub regression
        if: steps.scope.outputs.mode == 'tour'
        run: npx playwright test tests/explore.spec.ts --project=mobile --workers=1 --grep "Tour hub stays compact and keeps deep navigation available"
      - name: Run contextual entertainment regression
        if: steps.scope.outputs.mode == 'entertainment-context'
        run: npx playwright test tests/entertainment.spec.ts --project=desktop --workers=1 --grep "contextual entertainment detail pages expose country and source dates"
      - name: Run directory navigation regression
        if: steps.scope.outputs.mode == 'quality'
        run: npx playwright test tests/directory-navigation.spec.ts --project=desktop --workers=1
      - name: Run browser smoke regression
        if: steps.scope.outputs.mode == 'smoke'
        run: npx playwright test tests/smoke.spec.ts --project=desktop --workers=1
      - name: Run admin editing regression first
        if: steps.scope.outputs.mode == 'full'
        run: npx playwright test tests/admin-editing.spec.ts tests/admin-github.spec.ts --project=desktop --workers=1
      - name: Run full browser suite
        if: steps.scope.outputs.mode == 'full'
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
; then
