name: Browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/ui-qa.yml"
  pull_request:

concurrency:
  group: browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect browser-relevant changes
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD^1 HEAD -- app components lib public tests playwright.config.ts package.json next.config.ts; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No browser-relevant changes; required smoke check can finish without the full suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.run == 'true'
      - run: npm run build:next
        if: steps.scope.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.run == 'true'
      - name: Run admin editing regression first
        if: steps.scope.outputs.run == 'true'
        run: npx playwright test tests/admin-editing.spec.ts tests/admin-github.spec.ts --project=desktop --workers=1
      - run: npm run test:e2e
        if: steps.scope.outputs.run == 'true'
      - name: Upload Playwright report on failure
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
