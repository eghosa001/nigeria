name: Cloudflare Direct Deploy Fallback

# Emergency/manual fallback only: Cloudflare Workers Builds owns automatic main deployments.
# Running a second writer on every push races the primary deployment and created
# avoidable false-negative API failures.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-direct-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # NEXT_PUBLIC_* values are inlined into dist/ at build time, never read from
      # Worker bindings at runtime. They must be present for `npm run build` or the
      # deployed bundle silently loses advertising. Keep these in Actions secrets.
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT }}
      NEXT_PUBLIC_ADSENSE_SLOT_SERVICE_AFTER_ANSWER: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SERVICE_AFTER_ANSWER }}
      NEXT_PUBLIC_ADSENSE_SLOT_SERVICE_MID: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_SERVICE_MID }}
      NEXT_PUBLIC_ADSENSE_SLOT_MOVIE_AFTER_CAST: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_MOVIE_AFTER_CAST }}
      NEXT_PUBLIC_ADSENSE_SLOT_MOVIE_AFTER_WATCH: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_MOVIE_AFTER_WATCH }}
      NEXT_PUBLIC_ADSENSE_SLOT_JOB_AFTER_FACTS: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_JOB_AFTER_FACTS }}
      NEXT_PUBLIC_ADSENSE_SLOT_TOUR_AFTER_INTRO: ${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_TOUR_AFTER_INTRO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deploy credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret is configured; leaving deployment to Workers Builds."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report AdSense build inputs
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          if [ -z "${NEXT_PUBLIC_ADSENSE_CLIENT:-}" ]; then
            echo "::warning::NEXT_PUBLIC_ADSENSE_CLIENT is empty; deploying a build with no AdSense loader and /ads.txt returns 404."
          fi
          missing=""
          for slot in SERVICE_AFTER_ANSWER SERVICE_MID MOVIE_AFTER_CAST MOVIE_AFTER_WATCH JOB_AFTER_FACTS TOUR_AFTER_INTRO; do
            if [ -z "$(printenv "NEXT_PUBLIC_ADSENSE_SLOT_${slot}")" ]; then
              missing="${missing} NEXT_PUBLIC_ADSENSE_SLOT_${slot}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::warning::Blank AdSense slots (renders no ad):${missing}"
          fi
      - run: npm install --no-audit --no-fund
        if: steps.credentials.outputs.available == 'true'
      - run: npm run build
        if: steps.credentials.outputs.available == 'true'
      - name: Verify AdSense values were inlined into the bundle
        if: steps.credentials.outputs.available == 'true' && env.NEXT_PUBLIC_ADSENSE_CLIENT != ''
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const client = process.env.NEXT_PUBLIC_ADSENSE_CLIENT;
          const slotNames = [
            "NEXT_PUBLIC_ADSENSE_SLOT_SERVICE_AFTER_ANSWER",
            "NEXT_PUBLIC_ADSENSE_SLOT_SERVICE_MID",
            "NEXT_PUBLIC_ADSENSE_SLOT_MOVIE_AFTER_CAST",
            "NEXT_PUBLIC_ADSENSE_SLOT_MOVIE_AFTER_WATCH",
            "NEXT_PUBLIC_ADSENSE_SLOT_JOB_AFTER_FACTS",
            "NEXT_PUBLIC_ADSENSE_SLOT_TOUR_AFTER_INTRO",
          ];
          const slots = slotNames.map((name) => process.env[name]).filter(Boolean);

          if (slots.length === 0) {
            console.error("NEXT_PUBLIC_ADSENSE_CLIENT is set but every AdSense slot secret is blank.");
            console.error("That would deploy a loader and /ads.txt with zero ad units. Add the slot secrets.");
            process.exit(1);
          }

          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith(".js")) files.push(full);
            }
          };
          walk("dist");

          const corpus = files.map((f) => fs.readFileSync(f, "utf8")).join("\n");

          const missing = [client, ...slots].filter((value) => !corpus.includes(value));
          if (missing.length > 0) {
            console.error("AdSense values were not inlined into dist/: " + missing.join(", "));
            console.error("These NEXT_PUBLIC_* values must be set as Actions secrets before build.");
            process.exit(1);
          }
          console.log(`AdSense inlining verified for ${slots.length + 1} value(s).`);
          NODE
      - name: Deploy directly with Wrangler and verify the exact commit
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          status=0
          npx wrangler deploy --config dist/server/wrangler.json >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "Wrangler confirmed deployment."
            exit 0
          fi

          # Wrangler has sometimes rejected Cloudflare's *200 OK* deployment
          # history response after submitting a deployment. This is NOT a
          # successful build/upload signal on its own. Never ignore any other
          # API error, 403/5xx or unsuccessful deployment.
          if ! grep -Fq 'Received a malformed response from the API' "$log" ||
             ! grep -Eq 'GET /accounts/[^ ]+/workers/scripts/mynigeriaguide/deployments -> 200 OK' "$log"; then
            echo "::error::Wrangler failed (status $status); no benign deploy-history signature. Refusing to mark this deploy successful."
            exit "$status"
          fi

          echo "::warning::Wrangler could not parse Cloudflare's successful deploy-history response. Verify the exact commit on the production origin before accepting the result."
          for attempt in {1..12}; do
            body="$(curl -fsS --max-time 12 -H 'Cache-Control: no-cache' "https://mynigeriaguide.com/deployment.json?deploy_check=${GITHUB_SHA}-${attempt}" || true)"
            deployed="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Verified production is serving exact commit $GITHUB_SHA despite the Wrangler response-parsing error."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production never served the expected commit $GITHUB_SHA. Wrangler deployment remains FAILED."
          exit "$status"
