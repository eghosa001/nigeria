name: Production health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: https://mynigeriaguide.aighewieghosa111.workers.dev
    steps:
      - name: Probe critical public routes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/"
            "/services"
            "/fees"
            "/categories/foreign-visas"
            "/services/passport-renewal"
            "/admin/visits"
            "/sitemap.xml"
            "/robots.txt"
            "/api/health"
            "/deployment.json"
          )
          for path in "${paths[@]}"; do
            echo "Checking $path"
            curl --fail-with-body --silent --show-error --location \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              "$LIVE_BASE_URL$path" > /tmp/mng-response
          done

      - name: Verify health payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/api/health" |
          node --input-type=module <<'NODE'
          let body = "";
          process.stdin.setEncoding("utf8");
          for await (const chunk of process.stdin) body += chunk;
          const value = JSON.parse(body);
          if (value.status !== "ok") throw new Error("Health status is not ok.");
          if (value.product !== "MyNigeriaGuide") throw new Error("Unexpected health product.");
          if (!Number.isInteger(value.publicGuides) || value.publicGuides < 106) {
            throw new Error("Published guide count regressed below 106.");
          }
          console.log("Health OK with", value.publicGuides, "public guides.");
          NODE

      - name: Verify SEO discovery endpoints
        shell: bash
        run: |
          set -euo pipefail
          sitemap="$(curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/sitemap.xml")"
          printf '%s' "$sitemap" | grep -q "/services/passport-renewal"
          printf '%s' "$sitemap" | grep -q "/categories/foreign-visas"

          robots="$(curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/robots.txt")"
          printf '%s' "$robots" | grep -qi "sitemap:"
          printf '%s' "$robots" | grep -qi "disallow: /admin"
          echo "Sitemap and robots discovery checks passed."

      - name: Verify analytics remains configured and locked
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 \
            --output /tmp/analytics.json --write-out '%{http_code}' \
            "$LIVE_BASE_URL/api/admin/analytics?range=7d")"
          if [ "$status" != "401" ]; then
            echo "Expected analytics endpoint to be protected with HTTP 401, got $status."
            cat /tmp/analytics.json
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/analytics.json", "utf8"));
          if (value.configured !== true || value.authenticated !== false) {
            throw new Error("Analytics is not in the expected configured-and-locked state.");
          }
          console.log("Analytics is configured and protected.");
          NODE

      - name: Verify deployment metadata is present
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/deployment.json" > /tmp/deployment.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/deployment.json", "utf8"));
          if (typeof value.commit !== "string" || !/^[0-9a-f]{40}$/i.test(value.commit)) {
            throw new Error("Production deployment metadata does not contain a valid commit SHA.");
          }
          console.log("Production commit:", value.commit);
          NODE
