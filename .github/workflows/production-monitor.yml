name: Production health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_BASE_URL: https://mynigeriaguide.com
    steps:
      - name: Probe critical public routes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/"
            "/services"
            "/fees"
            "/categories/foreign-visas"
            "/services/passport-renewal"
            "/assistant"
            "/entertainment/movies/oversabi-aunty"
            "/explore/calabar"
            "/jobs/firstbank-technology-academy-2026"
            "/sitemap.xml"
            "/sitemap-index.xml"
            "/sitemaps/core.xml"
            "/sitemaps/services.xml"
            "/sitemaps/travel.xml"
            "/sitemaps/movies.xml"
            "/sitemaps/youtube.xml"
            "/robots.txt"
            "/api/health"
            "/deployment.json"
          )
          for path in "${paths[@]}"; do
            echo "Checking $path"
            curl --fail-with-body --silent --show-error --location \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              "$LIVE_BASE_URL$path" > /tmp/mng-response
          done

      - name: Detect intermittent Worker resource failures
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/"
            "/services/passport-renewal"
            "/assistant"
            "/topics/nigerian-passport"
            "/entertainment/youtube/KWIpR47N9hc"
            "/entertainment/youtube/2Ficn2BMlI8"
            "/entertainment/youtube/zxvtMba4MYE"
            "/entertainment/youtube/GrxitJ4fHT8"
          )
          for round in 1 2 3; do
            for path in "${paths[@]}"; do
              body="$(mktemp)"
              status="$(curl --silent --show-error --max-time 30 --output "$body" --write-out '%{http_code}' "$LIVE_BASE_URL$path")"
              if [ "$status" -ge 500 ] || grep -Eqi 'Worker exceeded resource limits|Error 1102' "$body"; then
                echo "Worker resource failure detected on $path during round $round (HTTP $status)."
                cat "$body"
                exit 1
              fi
            done
          done
          echo "Repeated Worker stability probes passed."

      - name: Verify health payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/api/health" > /tmp/health.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          if (value.status !== "ok") throw new Error("Health status is not ok.");
          if (value.product !== "MyNigeriaGuide") throw new Error("Unexpected health product.");
          if (!Number.isInteger(value.publicGuides) || value.publicGuides < 106) {
            throw new Error("Published guide count regressed below 106.");
          }
          console.log("Health OK with", value.publicGuides, "public guides.");
          NODE

      - name: Verify SEO discovery endpoints
        shell: bash
        run: |
          set -euo pipefail
          index="$(curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/sitemap-index.xml")"
          printf '%s' "$index" | grep -q "/sitemaps/services.xml"
          printf '%s' "$index" | grep -q "/sitemaps/youtube.xml"

          services="$(curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/sitemaps/services.xml")"
          printf '%s' "$services" | grep -q "/services/passport-renewal"

          youtube="$(curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/sitemaps/youtube.xml")"
          printf '%s' "$youtube" | grep -q "/entertainment/youtube/channels/"
          printf '%s' "$youtube" | grep -Eq '/entertainment/youtube/[A-Za-z0-9_-]{11}</loc>'

          robots="$(curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/robots.txt")"
          printf '%s' "$robots" | grep -qi "sitemap: $LIVE_BASE_URL/sitemap-index.xml"
          printf '%s' "$robots" | grep -qi "disallow: /admin"
          echo "Sitemap index, section sitemaps and robots discovery checks passed."

      - name: Verify Cloudflare Access protects admin surfaces
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            "/admin/visits"
            "/admin/api/analytics?range=7d"
            "/admin/api/content-access"
          )
          for path in "${paths[@]}"; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --max-time 30 --max-redirs 0 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "$LIVE_BASE_URL$path")"
            if [ "$status" != "302" ]; then
              echo "Expected Cloudflare Access redirect for $path, got HTTP $status."
              cat "$headers"
              exit 1
            fi
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            if ! printf '%s' "$location" | grep -Eq '^https://[^/]+\.cloudflareaccess\.com/cdn-cgi/access/login/'; then
              echo "Unexpected Access redirect for $path: $location"
              exit 1
            fi
            echo "Cloudflare Access protects $path."
          done

      - name: Verify deployment metadata is present
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 "$LIVE_BASE_URL/deployment.json" > /tmp/deployment.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const value = JSON.parse(fs.readFileSync("/tmp/deployment.json", "utf8"));
          if (typeof value.commit !== "string" || !/^[0-9a-f]{40}$/i.test(value.commit)) {
            throw new Error("Production deployment metadata does not contain a valid commit SHA.");
          }
          console.log("Production commit:", value.commit);
          NODE
