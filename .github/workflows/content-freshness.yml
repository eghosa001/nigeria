name: Content Freshness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/services.json"
      - "data/youtube-channel-cache.json"
      - "lib/content-freshness.ts"
      - "lib/content-health.ts"
      - "lib/entertainment.ts"
      - "lib/entertainment-extras.ts"
      - "lib/explore.ts"
      - "lib/explore-places.ts"
      - "lib/jobs.ts"
      - "lib/job-scale-wave.ts"
      - "scripts/check-freshness.ts"
      - ".github/workflows/content-freshness.yml"

permissions:
  contents: read

concurrency:
  group: content-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Scope freshness audit to changed sources
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_SHA" --depth=1
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if echo "$changed" | grep -Eq '^(data/(services|youtube-channel-cache)[.]json|lib/(content-freshness|content-health|explore|explore-places)[.]ts|scripts/check-freshness[.]ts)$'; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qx 'lib/entertainment-extras.ts'; then
            echo "mode=releases" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qx 'lib/entertainment.ts'; then
            echo "mode=movies" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "Unrelated changes have dedicated tests; the consolidated six-hour site task handles periodic freshness."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'skip'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.mode == 'full'
      - run: npm run check:freshness
        if: steps.scope.outputs.mode == 'full'
      - name: Check changed release-source records
        if: steps.scope.outputs.mode == 'releases'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changed-release-freshness.mjs
      - name: Check changed movie-source dates
        if: steps.scope.outputs.mode == 'movies'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changed-movie-freshness.mjs
