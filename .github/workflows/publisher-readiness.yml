name: Publisher Readiness Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Every changed publication source, not only one file naming convention.
      - "data/**/*.json"
      - "data/*.json"
      - "lib/data.ts"
      - "lib/service*.ts"
      - "lib/agency*.ts"
      - "lib/entertainment*.ts"
      - "lib/movie-*.ts"
      - "lib/series*.ts"
      - "lib/youtube*.ts"
      - "lib/explore*.ts"
      - "lib/destination*.ts"
      - "lib/jobs*.ts"
      - "lib/job*.ts"
      - "lib/career*.ts"
      # Changed user-visible page structure can affect publisher eligibility.
      - "app/services/**"
      - "app/agencies/**"
      - "app/entertainment/**"
      - "app/explore/**"
      - "app/jobs/**"
      - "scripts/audit-publisher-readiness.ts"
      - "scripts/audit-legacy-content.ts"
      - "scripts/audit-publication-standards.ts"
      - "docs/FOUR_PILLAR_PUBLICATION_STANDARD.md"
      - ".github/workflows/publisher-readiness.yml"

permissions:
  contents: read

concurrency:
  group: publisher-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publisher-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify owner minimal-CI guard
        run: python3 scripts/fast_path_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit catalog source-content signals only (read-only)
        run: |
          ./node_modules/.bin/tsx scripts/audit-publisher-readiness.ts --json > publisher-audit.json
          ./node_modules/.bin/tsx scripts/audit-legacy-content.ts --json > legacy-audit.json
          ./node_modules/.bin/tsx scripts/audit-publication-standards.ts --json > publication-standards.json
          node -e 'const a=require("./legacy-audit.json"); if(!a.coverage.allCatalogRecords||a.coverage.indexableCatalogRecords<1000) process.exit(1); console.log("Legacy records inspected:",a.coverage.allCatalogRecords,"indexable:",a.coverage.indexableCatalogRecords); for(const x of a.groups) console.log(x.group,JSON.stringify(x)); console.log("Issue counts:",JSON.stringify(a.issueCounts));'
          node -e 'const a=require("./publisher-audit.json"); if(!a.uniqueCatalogUrls||a.byPillar.length!==6) process.exit(1); for(const x of a.byPillar) console.log(x.pillar, JSON.stringify(x)); console.log("Publisher audit generated:",a.uniqueCatalogUrls,"records");'
      - name: Strict new-page publication gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          ./node_modules/.bin/tsx scripts/audit-publication-standards.ts --gate-new --base="$BASE_SHA"
      - name: Verify three exact biographies and stale-source protection
        run: ./node_modules/.bin/tsx --test tests/movies-three-source-matched-biographies-20261017.test.ts
      - name: Verify nonrepetitive, source-faithful service and film guidance
        run: ./node_modules/.bin/tsx --test tests/adsense-nonrepetitive-sourced-guides-20261017.test.ts
      - name: Guard four unresolved movie credits and watch availability
        run: ./node_modules/.bin/tsx --test tests/movie-final-four-unverified-guard-20261017.test.ts
      - name: Verify artwork rights fallback and evidence-only service guidance
        run: ./node_modules/.bin/tsx --test tests/adsense-media-rights-and-service-specificity-20261017.test.ts
      - name: Verify reader journeys and source-specific publishing
        run: ./node_modules/.bin/tsx --test tests/benchmark-reader-journeys-20261017.test.ts
      - name: Verify honest source-review dates and freshness workflow
        run: ./node_modules/.bin/tsx --test tests/source-review-age-and-admin-queue-20261017.test.ts
      - name: Verify eleven official-source service rechecks and honest dates
        run: ./node_modules/.bin/tsx --test tests/official-source-recheck-20261017.test.ts
      - name: Validate second source-review batch
        run: ./node_modules/.bin/tsx --test tests/official-source-recheck-batch2-20261017.test.ts
      - name: Summarize all four-pillar publication checks
        run: |
          node -e 'const a=require("./publication-standards.json"); for (const p of a.byPillar) console.log(p.pillar + ": " + p.records + " records / " + p.blockers + " indexable with automatic blockers / " + p.editorialReview + " needing review"); console.log("Full catalog records checked:",a.coverage.sourceCatalogRecords); if(a.byPillar.length!==4 || a.coverage.sourceCatalogRecords<1000) process.exit(1);'
      - name: Store audit artifact for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: publisher-readiness-audit
          path: | 
            publisher-audit.json
            legacy-audit.json
            publication-standards.json
          retention-days: 14
