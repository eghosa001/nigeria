name: IndexNow - Incremental Discovery

on:
  workflow_dispatch:
    inputs:
      full_resubmit:
        description: "Explicitly re-notify all canonical URLs (normally unnecessary)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/**"
      - "lib/**"
      - "public/**"
      - "scripts/indexnow-*.mjs"
      - "scripts/submit-indexnow.mjs"
      - "scripts/generate-static-sitemaps.ts"
      - ".github/workflows/indexnow.yml"

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_BASE_URL: https://mynigeriaguide.com
      INDEXNOW_FORCE_ALL: ${{ inputs.full_resubmit || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify focused IndexNow tests
        run: node --test scripts/indexnow-sitemap.test.mjs
      - name: Restore last successful published URL snapshot
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-prod-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-prod-
      - name: Find directly changed static routes
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD | paste -sd ',' -)"
            echo "INDEXNOW_CHANGED_PATHS=$changed" >> "$GITHUB_ENV"
          fi
      - name: Wait for this exact commit to reach production
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          for i in {1..60}; do
            body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$LIVE_BASE_URL/deployment.json?expected=$expected&attempt=$i" || true)"
            deployed="$(printf '%s' "$body" | node -e '
              let data="";
              process.stdin.on("data", c => data += c);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(data).commit || ""); } catch {}
              });
            ')"
            if [ "$deployed" = "$expected" ]; then
              echo "Verified production deployment: $expected"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not reach commit $expected within 10 minutes; no URL notifications sent."
          exit 1
      - name: Notify IndexNow of changed production URLs only
        run: node scripts/submit-indexnow.mjs
      - name: Save accepted URL snapshot
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-prod-${{ github.run_id }}-${{ github.run_attempt }}
