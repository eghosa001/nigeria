name: Googlebot Crawler Parity

on:
  pull_request:
    paths:
      - "scripts/check-googlebot-crawl-parity.mjs"
      - "tests/googlebot-crawl-parity.test.mjs"
      - ".github/workflows/googlebot-crawler-parity.yml"
      - ".github/workflows/production-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crawl-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test indexability and canonical validation
        run: node --test tests/googlebot-crawl-parity.test.mjs tests/vinext-head-metadata.test.mjs
      - name: Inspect active Cloudflare cache rules and simulated Googlebot routing (read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostic/googlebot-cache-headers-20261030'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/cloudflare-cache-readonly-audit.mjs
      - name: Record existing production crawler failure before patch deployment
        # Production still runs old Vinext until this PR is merged and deployed.
        # This diagnostic must not be mistaken for a test of the PR build.
        continue-on-error: true
        run: node scripts/check-googlebot-crawl-parity.mjs
