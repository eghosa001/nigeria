name: Google Indexing API - Verified JobPosting Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/jobs.ts"
      - "lib/job-*.ts"
      - "lib/job-scale-wave.ts"
      - "scripts/google-indexing-*.mjs"
      - "scripts/google-job-indexing-*.mjs"
      - "scripts/google-indexing-eligible-jobs.ts"
      - ".github/workflows/google-job-indexing.yml"
  schedule:
    - cron: "18 5 * * *"
permissions:
  contents: read
  id-token: write
concurrency:
  group: google-jobs-indexing
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_INDEXING_SERVICE_ACCOUNT: ${{ vars.GCP_INDEXING_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused safety-policy tests
        run: node --test scripts/google-job-indexing-plan.test.mjs
      - name: Choose supported Google authentication
        id: identity
        shell: bash
        run: |
          if [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_INDEXING_SERVICE_ACCOUNT" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "Google Indexing API using keyless GitHub OIDC Workload Identity Federation."
          elif [ -n "$GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON" ]; then
            echo "method=json" >> "$GITHUB_OUTPUT"
            echo "::notice::Legacy service account key is set; prefer keyless GitHub OIDC."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "Google indexing not configured; see docs/SEARCH_DISCOVERY_ACTIVATION.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install TypeScript runtime if configured
        if: steps.identity.outputs.method != 'none'
        run: npm install --no-audit --no-fund
      - name: Export live qualifying job postings only
        if: steps.identity.outputs.method != 'none'
        run: npx tsx scripts/google-indexing-eligible-jobs.ts
      - name: Restore accepted notification checkpoint
        if: steps.identity.outputs.method != 'none'
        uses: actions/cache/restore@v4
        with:
          path: .discovery/google-indexing-state.json
          key: google-jobs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            google-jobs-
      - name: Confirm exact commit is in production
        if: steps.identity.outputs.method != 'none'
        shell: bash
        run: |
          set -euo pipefail
          for n in {1..48}; do
            response="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://mynigeriaguide.com/deployment.json?check=${GITHUB_SHA}-$n" || true)"
            deployed="$(printf '%s' "$response" | node -e 'let a="";process.stdin.on("data",x=>a+=x);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(a).commit||"")}catch{}})')"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Verified production deployment: $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production does not serve this exact commit, no notifications sent."
          exit 1
      - name: Authenticate through short-lived GitHub OIDC token
        id: oidc
        if: steps.identity.outputs.method == 'oidc'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_INDEXING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/indexing
          create_credentials_file: false
      - name: Submit changed verified JobPosting pages only
        if: steps.identity.outputs.method != 'none'
        env:
          GOOGLE_INDEXING_ACCESS_TOKEN: ${{ steps.oidc.outputs.access_token }}
        run: node scripts/google-indexing-notify.mjs
      - name: Save accepted notification checkpoint
        if: steps.identity.outputs.method != 'none' && success()
        uses: actions/cache/save@v4
        with:
          path: .discovery/google-indexing-state.json
          key: google-jobs-${{ github.run_id }}-${{ github.run_attempt }}
