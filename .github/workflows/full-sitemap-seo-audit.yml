name: Full Sitemap SEO Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit-all-sitemap-urls.mjs'
  push:
    branches: [main]
    paths:
      - 'components/lazy-youtube-player.tsx'
      - 'app/fees/page.tsx'
      - 'components/fee-directory.tsx'
      - 'lib/fee-query.ts'
      - 'app/api/fees/route.ts'

permissions:
  contents: read

concurrency:
  group: full-sitemap-seo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate focused audit script
        run: node --check scripts/audit-all-sitemap-urls.mjs
      - name: Wait for corrected production HTML after deployment
        if: github.event_name == 'push'
        run: |
          for attempt in {1..24}; do
            if curl -fsSL --max-time 12 -A 'MyNigeriaGuide-SEOAuditBot/1.0' https://mynigeriaguide.com/fees -o /tmp/mng-fees.html; then
              size=$(wc -c < /tmp/mng-fees.html)
              echo "Production fees HTML: ${size} bytes"
              if [ "$size" -lt 600000 ]; then exit 0; fi
            fi
            sleep 15
          done
          echo "Updated production fees HTML was not observed; refusing a stale full-site re-audit"
          exit 1
      - name: Crawl every public sitemap URL
        env:
          SEO_CONCURRENCY: '5'
          SEO_SITEMAP: https://mynigeriaguide.com/sitemap-index.xml
          SEO_REPORT_DIR: seo-audit-results
        run: node scripts/audit-all-sitemap-urls.mjs
      - name: Upload complete URL-by-URL audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-sitemap-seo-audit
          path: seo-audit-results/
          if-no-files-found: warn
          retention-days: 14
