name: Live Deployment QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "next.config.ts"
      - "wrangler.jsonc"
      - "playwright.live.config.ts"
      - ".github/workflows/live-qa.yml"

concurrency:
  group: live-deployment-qa
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect whether live QA is needed
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          jobs_trigger="$(printf '%s\n' "$changed" | grep -E '^(app/jobs/|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides)\.ts$|scripts/check-jobs-content\.ts$)' || true)"
          non_jobs="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/(ci|ui-qa|cloudflare-qa|live-qa)\.yml$|docs/JOBS_AND_CAREERS\.md$|package\.json$|app/jobs/|app/search/page\.tsx$|components/(job-[a-z-]+|jobs-directory)\.tsx$|lib/(jobs|job-[a-z-]+|career-guides|sitemap-sections|global-search)\.ts$|cloudflare/d1/jobs-scale-schema\.sql$|scripts/check-jobs-content\.ts$)' || true)"
          if [ -n "$jobs_trigger" ] && [ -z "$non_jobs" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Jobs-only deployment; no broad live browser suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  live-smoke:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: https://mynigeriaguide.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Confirm Cloudflare Access intercepts private admin routes
        shell: bash
        run: |
          set -euo pipefail
          for path in "/admin/visits" "/admin/api/analytics?range=7d" "/admin/api/content-access"; do
            headers="$(mktemp)"
            status="$(curl -sS --max-time 15 --max-redirs 0 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
              "$LIVE_BASE_URL$path")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            if [ "$status" != "302" ] || ! printf '%s' "$location" | grep -Eq '^https://[^/]+\.cloudflareaccess\.com/cdn-cgi/access/login/'; then
              echo "Cloudflare Access did not intercept $path as expected (status=$status, location=$location)."
              exit 1
            fi
            echo "Cloudflare Access confirmed for $path."
          done
      - name: Wait for this exact commit to reach Cloudflare production
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          for i in {1..60}; do
            body="$(curl -fsS --max-time 15 "$LIVE_BASE_URL/deployment.json?expected=$expected&attempt=$i" || true)"
            deployed="$(printf '%s' "$body" | node -e '
              let data="";
              process.stdin.on("data", c => data += c);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(data).commit || ""); } catch {}
              });
            ')"
            if [ "$deployed" = "$expected" ]; then
              echo "Verified production deployment: $expected"
              exit 0
            fi
            echo "Waiting for Cloudflare production ($i/60). Expected $(echo "$expected" | cut -c1-12), found $(echo "$deployed" | cut -c1-12)."
            sleep 10
          done
          echo "Production did not reach commit $expected within 10 minutes."
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.live.config.ts tests/live-deployment.spec.ts
