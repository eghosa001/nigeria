name: Live Deployment QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "playwright.live.config.ts"
      - ".github/workflows/live-qa.yml"

concurrency:
  group: live-deployment-qa
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: https://mynigeriaguide.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Probe private admin configuration flags
        shell: bash
        run: |
          echo "Current production analytics setup (booleans only; no credentials):"
          curl -sS --max-time 15 "$LIVE_BASE_URL/api/admin/analytics?range=7d" || true
          echo
          echo "Current production guide-editor setup (booleans only; no credentials):"
          curl -sS --max-time 15 "$LIVE_BASE_URL/api/admin/content-access" || true
          echo
      - name: Wait for this exact commit to reach Cloudflare production
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          for i in {1..60}; do
            body="$(curl -fsS --max-time 15 "$LIVE_BASE_URL/deployment.json?expected=$expected&attempt=$i" || true)"
            deployed="$(printf '%s' "$body" | node -e '
              let data="";
              process.stdin.on("data", c => data += c);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(data).commit || ""); } catch {}
              });
            ')"
            if [ "$deployed" = "$expected" ]; then
              echo "Verified production deployment: $expected"
              exit 0
            fi
            echo "Waiting for Cloudflare production ($i/60). Expected $(echo "$expected" | cut -c1-12), found $(echo "$deployed" | cut -c1-12)."
            sleep 10
          done
          echo "Production did not reach commit $expected within 10 minutes."
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.live.config.ts tests/live-deployment.spec.ts
