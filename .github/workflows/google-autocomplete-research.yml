name: Evergreen Google Autocomplete Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/google-autocomplete-research.mjs'
      - 'tools/google-autocomplete-curation.mjs'
      - 'tests/google-autocomplete-curation.test.mjs'
      - '.github/workflows/google-autocomplete-research.yml'
  schedule:
    - cron: "0 5 * * 2" # weekly on Tuesday, 06:00 Africa/Lagos

permissions:
  contents: read

concurrency:
  group: google-autocomplete-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample-suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preserve owner-locked shortest CI policy
        run: python3 scripts/fast_path_guard.py
      - name: Query Nigeria-localized Google Autocomplete (research only)
        run: node tools/google-autocomplete-research.mjs

      - name: Verify topic-relevance safety filters
        run: node --test tests/google-autocomplete-curation.test.mjs
      - name: Split observed suggestions into candidates and review queue
        run: node tools/google-autocomplete-curation.mjs
      - name: Upload Nigeria Google Suggest evidence and review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-autocomplete-ng
          path: |
            artifacts/google-autocomplete-ng.json
            artifacts/google-autocomplete-reviewed-ng.csv
            artifacts/google-autocomplete-review-queue-ng.csv
            artifacts/google-autocomplete-review-summary-ng.json
          if-no-files-found: warn
          retention-days: 14
