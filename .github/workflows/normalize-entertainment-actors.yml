name: Normalize Entertainment Actor Metadata

on:
  push:
    branches:
      - feature/movies-entertainment
    paths:
      - scripts/normalize-entertainment-actor-names.mjs
      - .github/workflows/normalize-entertainment-actors.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-entertainment-actors
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize actor casing
        run: node scripts/normalize-entertainment-actor-names.mjs

      - name: Validate entertainment catalog
        run: node scripts/check-entertainment-scale.mjs

      - name: Commit normalized metadata
        run: |
          if git diff --quiet -- data/youtube-movies.generated.json; then
            echo "No actor metadata changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-movies.generated.json
          git commit -m "Normalize generated movie actor names"
          git push origin HEAD:feature/movies-entertainment
